version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: hospital-mysql
    restart: always
    mem_limit: ${MYSQL_MEM_LIMIT:-400M}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/hospital.txt:/docker-entrypoint-initdb.d/01_init.sql
      - ../database/improvements.sql:/docker-entrypoint-initdb.d/02_improvements.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --performance-schema=OFF # 2G内存省资源
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hospital-redis
    restart: always
    mem_limit: ${REDIS_MEM_LIMIT:-64M}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 32mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../hospit
      dockerfile: ../docker/Dockerfile.backend
    container_name: hospital-backend
    restart: always
    mem_limit: ${BACKEND_MEM_LIMIT:-512M}
    ports:
      - "${BACKEND_PORT}:8090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      JAVA_OPTS: "-Xmx384m -Xms128m -XX:+UseG1GC"
    volumes:
      - uploads:/app/uploads
      - backend_logs:/app/logs

  frontend:
    build:
      context: ../hos-web
      dockerfile: ../docker/Dockerfile.frontend
    container_name: hospital-frontend
    restart: always
    mem_limit: 64M
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  uploads:
  backend_logs: