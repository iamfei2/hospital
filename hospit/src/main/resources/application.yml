server:
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hospital?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

crypto:
  secret-key: Hospit2026SecKey

file:
  upload-path: D:/hospital_uploads

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'open-api'
      packages-to-scan: com.hospit.controller
      paths-to-match: /open/api/**
    - group: 'backup'
      packages-to-scan: com.hospit.controller
      paths-to-match: /backup/**
    - group: 'statistics'
      packages-to-scan: com.hospit.controller
      paths-to-match: /statistics/**
    - group: 'default'
      packages-to-scan: com.hospit.controller

sentinel:
  transport:
    dashboard: localhost:8080
    port: 8719
  eager:
    true
  filter:
    enabled: true
